[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ios-decrypt-hub"
version = "0.7.0"
description = "Connect to IOSDecryptHub devices and bridge HTTP MCP to stdio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "taisuii" }]
keywords = ["ios", "mcp", "reverse-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
]

[project.urls]
Homepage = "https://ios.decrypthub.com/"
Repository = "https://github.com/decrypthub/idh-cli"
Issues = "https://github.com/decrypthub/idh-cli/issues"

[project.scripts]
idh = "idh.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
idh = ["prompts/*.json", "prompts/*.md", "prompts/skills/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
