name: Desktop MCP component
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/build_component.py
      - uses: actions/upload-artifact@v4
        with:
          name: idh-component-${{ runner.os }}
          path: dist/idh-*.zip*
